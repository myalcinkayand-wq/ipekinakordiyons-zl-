<style>
:root{color-scheme:light dark;--plate:#534AB7;--plate2:#3C3489;--key:#F1EFE8;--ink:#2C2C2A;--accent:#FAC775;--paper:#FFF9E8;--soft:#D9D5F5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--plate:#2C2C2A;--plate2:#1F1F1E;--soft:#B4B2A9}}
:root[data-theme="dark"]{--plate:#2C2C2A;--plate2:#1F1F1E;--soft:#B4B2A9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--plate);color:var(--key);font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 28px}
h1{margin:0 0 4px;font-size:1.7rem;font-weight:600;color:var(--accent);line-height:1.15}
.lead{margin:0 0 16px;color:var(--soft)}
.stage{background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;border:3px solid var(--plate2)}
.art svg{display:block;width:100%;height:auto}
.art svg.in{animation:fade .35s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.art svg.in{animation:none}}
.art text{font-family:inherit}
.txt{padding:14px 16px 18px}
.txt h2{margin:0;font-size:2rem;font-weight:600;line-height:1.1}
.mean{margin:4px 0 12px;color:#5F5E5A}
.sent{margin:0;font-size:1.2rem;font-weight:600;line-height:1.35}
.tag{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:99px;background:var(--accent);color:#412402;font-size:.85rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.keys button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--key);border:0;border-bottom:6px solid var(--c);border-radius:6px 6px 12px 12px;padding:14px 2px 10px;cursor:pointer}
.keys button[aria-pressed="true"]{background:var(--accent)}
.keys button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.play{font:inherit;margin:10px 0 0 8px;padding:3px 14px;border:0;border-radius:99px;background:var(--plate);color:#fff;cursor:pointer}.play:focus-visible{outline:3px solid var(--accent);outline-offset:2px}footer{margin-top:18px;font-size:.8rem;color:var(--soft)}
</style>
</head>

<div class="wrap">
<h1>Benim Akordiyon Sözlüğüm</h1>
<p class="lead">Bir kelimeye dokun, o kelimenin yaşandığı sahneyi gör.</p>

<div class="art" id="art"></div>
<div class="txt"><h2 id="w"></h2><p class="mean" id="n"></p><p class="sent" id="s"></p><span class="tag" id="k"></span><button type="button" class="play" id="pl">▶ Sesi dinle</button></div>

function noise(a,d,t,dur,v,fc,q){const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fc;f.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(d);s.start(t)}
function pluck(a,d,t,f,dur,v){[0,4].forEach(c=>{const o=osc(a,'sawtooth',f,t,dur,c),g=a.createGain(),l=a.createBiquadFilter();l.type='lowpass';l.frequency.setValueAtTime(3500,t);l.frequency.exponentialRampToValueAtTime(600,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/2,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(l);l.connect(g);g.connect(d)})}
function flute(a,d,t,f,dur,v,br){const o=osc(a,'triangle',f,t,dur),g=a.createGain();vib(a,o,f,5,.006,t,dur);env(g,t,v,.08,dur,.1);o.connect(g);g.connect(d);noise(a,d,t,Math.min(dur,.6),br,f*2,1.5)}
function zurna(a,d,t,f,dur,v){const o=osc(a,'sawtooth',f,t,dur),o2=osc(a,'square',f*1.004,t,dur),g=a.createGain(),b=a.createBiquadFilter(),l=a.createBiquadFilter();b.type='bandpass';b.frequency.value=1500;b.Q.value=2.5;l.type='lowpass';l.frequency.value=3200;env(g,t,v,.03,dur,.05);o.connect(b);o2.connect(b);b.connect(l);l.connect(g);g.connect(d)}
function bow(a,d,t,f,dur,v){const o=osc(a,'sawtooth',f,t,dur),g=a.createGain(),l=a.createBiquadFilter();vib(a,o,f,6,.008,t,dur);l.type='lowpass';l.frequency.value=2400;l.Q.value=3;env(g,t,v,.05,dur,.06);o.connect(l);l.connect(g);g.connect(d);noise(a,d,t,Math.min(dur,.25),.03,3000,1)}
function kick(a,d,t,f=110,dur=.35,v=.9){const o=osc(a,'sine',f,t,dur),g=a.createGain();o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+dur);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(d)}
function tak(a,d,t,v=.4){noise(a,d,t,.08,v,3500,.8)}
function def(a,d,t){kick(a,d,t,180,.2,.5);noise(a,d,t,.14,.25,8000,2)}
function bendir(a,d,t){kick(a,d,t,85,.45,.85)}
function baa(a,d,t,f,dur,v){const o=osc(a,'sawtooth',f,t,dur),g=a.createGain(),b=a.createBiquadFilter(),l=osc(a,'sine',22,t,dur),lg=a.createGain();o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.85,t+dur);lg.gain.value=18;l.connect(lg);lg.connect(o.frequency);b.type='bandpass';b.frequency.setValueAtTime(900,t);b.frequency.linearRampToValueAtTime(1300,t+dur*.5);b.Q.value=4;env(g,t,v,.05,dur,dur*.3);o.connect(b);b.connect(g);g.connect(d)}
function bell(a,d,t,f,dur,v){[1,2.01,3.97].forEach((m,i)=>{const o=osc(a,'sine',f*m,t,dur),g=a.createGain();g.gain.setValueAtTime(v/(i+1),t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(d)})}
function choir(a,d,t,fs,dur,v){fs.forEach(f=>[0,7,-7].forEach(c=>{const o=osc(a,'sawtooth',f,t,dur,c),g=a.createGain(),b1=a.createBiquadFilter(),b2=a.createBiquadFilter();b1.type='bandpass';b1.frequency.value=750;b1.Q.value=5;b2.type='bandpass';b2.frequency.value=1150;b2.Q.value=6;env(g,t,v/3,.3,dur,.4);o.connect(b1);o.connect(b2);b1.connect(g);b2.connect(g);g.connect(d)}))}
function say(txt,rate){if(!('speechSynthesis' in window))return false;const u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=rate||.85;u.pitch=1.1;speechSynthesis.speak(u);return true}
function synth(i){const a=ctx(),d=out(a),t=a.currentTime+.05;
switch(i){
case 0:[[57,0,.5],[60,.5,.5],[62,1,.5],[64,1.5,1],[62,2.5,.5],[60,3,.5],[59,3.5,.5],[57,4,1.4]].forEach(n=>{const c=Math.round(n[2]/.12);for(let k=0;k<c;k++)pluck(a,d,t+n[1]+k*.12,F(n[0]),.5,.3)});[0,2,4].forEach(x=>pluck(a,d,t+x,F(45),1.5,.35));break;
case 1:baa(a,d,t,330,.7,.3);baa(a,d,t+.9,300,.6,.3);[[69,1.8,.5],[72,2.3,.5],[71,2.8,.5],[69,3.3,.5],[67,3.8,.9],[69,4.7,.7],[64,5.4,1.4]].forEach(n=>flute(a,d,t+n[1],F(n[0]),n[2],.3,.07));break;
case 2:for(let r=0;r<3;r++){const b=t+r*2;[0,1,1.25].forEach(x=>kick(a,d,b+x));[.5,.75,1.5].forEach(x=>tak(a,d,b+x))}break;
case 3:[[69,0,.4],[71,.4,.2],[69,.6,.2],[67,.8,.5],[69,1.3,.4],[71,1.7,.4],[72,2.1,.9],[71,3,.3],[69,3.3,.3],[67,3.6,1]].forEach(n=>zurna(a,d,t+n[1],F(n[0]),n[2],.22));[0,1,1.5,2,3,3.5].forEach(x=>kick(a,d,t+x,110,.3,.6));break;
case 4:[[62,0,1.2],[65,1.2,1],[64,2.2,.8],[62,3,1],[60,4,1.8]].forEach(n=>flute(a,d,t+n[1],F(n[0]),n[2],.28,.1));break;
case 5:for(let r=0;r<3;r++)[0,.5,.75,1,1.5,1.75].forEach(x=>def(a,d,t+r*2+x));break;
case 6:[[76,0,.2],[74,.2,.2],[72,.4,.2],[74,.6,.2],[76,.8,.4],[79,1.2,.4],[76,1.6,.2],[74,1.8,.2],[72,2,.2],[74,2.2,.2],[76,2.4,.8],[72,3.3,.3],[74,3.6,.3],[76,3.9,1]].forEach(n=>bow(a,d,t+n[1],F(n[0]),n[2],.22));break;
case 7:[0,.8,1.2,1.6,2.4,3.2,3.6,4,4.8].forEach(x=>bendir(a,d,t+x));[.4,2,2.8].forEach(x=>tak(a,d,t+x,.3));break;
case 8:[57,60,64,60,57,60,64,60].forEach((n,k)=>pluck(a,d,t+k*.5,F(n),.6,.3));[[69,0,1],[72,1,1],[69,2,2]].forEach(n=>flute(a,d,t+n[1],F(n[0]),n[2],.25,.06));[0,1,2,3].forEach(x=>kick(a,d,t+x,110,.3,.5));[.5,1.5,2.5,3.5].forEach(x=>tak(a,d,t+x,.25));break;
case 9:[[62,0,.5],[63,.5,.5],[66,1,.5],[67,1.5,.5],[66,2,.5],[63,2.5,.5],[62,3,1.2],[69,4.3,.5],[67,4.8,.5],[66,5.3,.5],[63,5.8,.5],[62,6.3,1.4]].forEach(n=>{const c=Math.round(n[2]/.12);for(let k=0;k<c;k++)pluck(a,d,t+n[1]+k*.12,F(n[0]),.5,.3)});break;
case 10:[[67,0],[64,.6],[67,1.2],[69,1.8],[67,2.4],[64,3],[65,3.6],[62,4.2],[65,4.8],[67,5.4],[64,6]].forEach(n=>bell(a,d,t+n[1],F(n[0]),1.4,.22));break;
case 11:if(!say('Gökte yıldız parlıyor. Gönlüm sana varıyor. Şu güzel Türkçemizle. Mani olup çağlıyor.',.8))[60,62,64,65].forEach((n,k)=>bell(a,d,t+k*.6,F(n),1.4,.3));break;
case 12:[[60,0],[62,.7],[64,1.4],[65,2.1]].forEach(n=>bell(a,d,t+n[1],F(n[0]),1.4,.35));break;
case 13:[[72,0],[76,.35],[79,.7],[84,1.05],[79,1.6],[76,1.95],[72,2.3]].forEach(n=>bell(a,d,t+n[1],F(n[0]),1.4,.3));break;
case 14:choir(a,d,t,[F(48),F(52),F(55),F(60)],2.8,.25);choir(a,d,t+2.8,[F(53),F(57),F(60),F(65)],2.8,.25);break;
case 15:if(!say('Ses. Bir, iki, deneme.',.9))[880,880].forEach((f,k)=>bell(a,d,t+k*.5,f,.4,.3));break}}
function play(i){cur=i;stopAll();ctx();if(FILES[i]){au=new Audio(FILES[i]);au.play().catch(()=>synth(i));return}synth(i)}
document.getElementById('pl').onclick=()=>play(cur);
const cs=['#E24B4A','#F0A030','#FFD84D','#5CB85C','#5B8DEF','#B07CF0','#F4A6B8','#2BB5A5'];
const art=document.getElementById('art'),keys=document.getElementById('keys');
function show(i){
 const d=D[i];
 art.innerHTML='<svg class="in" viewBox="0 0 320 200" role="img" aria-label="'+d.w+': '+d.s+'">'+d.a+'</svg>';
 document.getElementById('w').textContent=d.w;
 document.getElementById('n').textContent=d.n;
 document.getElementById('s').textContent='“'+d.s+'”';
 document.getElementById('k').textContent=d.k;
 [...keys.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
}
D.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.textContent=d.w;b.style.setProperty('--c',cs[i%8]);b.onclick=()=>{show(i);play(i)};keys.appendChild(b);});
show(0);
